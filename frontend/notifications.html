<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - ESR Foods</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <span class="sidebar-logo-icon">🦐</span>
                    <span>ESR Foods</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="products.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🐟</span>
                    <span>Products</span>
                </a>
                <a href="inventory.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">📦</span>
                    <span>Inventory</span>
                </a>
                <a href="vendors.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🏭</span>
                    <span>Vendors</span>
                </a>
                <a href="purchases.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🛒</span>
                    <span>Purchases</span>
                </a>
                <a href="restaurants.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🍽️</span>
                    <span>Restaurants</span>
                </a>
                <a href="customers.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">👥</span>
                    <span>Customers</span>
                </a>
                <a href="orders.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">📋</span>
                    <span>Orders</span>
                </a>
                <a href="invoices.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🧾</span>
                    <span>Invoices</span>
                </a>
                <a href="payments.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">💰</span>
                    <span>Payments</span>
                </a>
                <a href="expenses.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">💸</span>
                    <span>Expenses</span>
                </a>
                <a href="reports.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">📈</span>
                    <span>Reports</span>
                </a>
                <a href="notifications.html" class="sidebar-nav-item active">
                    <span class="sidebar-nav-item-icon">🔔</span>
                    <span>Notifications</span>
                </a>
                <a href="users.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">👤</span>
                    <span>Users</span>
                </a>
                <a href="settings.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">⚙️</span>
                    <span>Settings</span>
                </a>
                <a href="#" class="sidebar-nav-item" onclick="logout()">
                    <span class="sidebar-nav-item-icon">🚪</span>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1 class="header-title">Notifications</h1>
                <div class="header-actions">
                    <span id="unreadCount" style="font-weight: 600; color: var(--highlight-color);"></span>
                    <button class="btn btn-secondary btn-sm" onclick="markAllAsRead()">Mark All as Read</button>
                    <span id="userName" style="font-weight: 600; color: var(--text-secondary);"></span>
                    <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
                </div>
            </header>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <label style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="unreadOnly" onchange="loadNotifications()">
                    <span>Show Unread Only</span>
                </label>
                <button class="btn btn-primary" onclick="openNotificationModal()">Add Notification</button>
            </div>

            <!-- Notifications List -->
            <div class="card">
                <div id="notificationsList">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Notification Modal -->
    <div class="modal" id="notificationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Add Notification</h3>
                <button class="modal-close" onclick="closeNotificationModal()">&times;</button>
            </div>
            <form id="notificationForm">
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" id="notificationTitle" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Message</label>
                    <textarea id="notificationMessage" class="form-textarea" required></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Type</label>
                    <select id="notificationType" class="form-select">
                        <option value="info">Info</option>
                        <option value="success">Success</option>
                        <option value="warning">Warning</option>
                        <option value="error">Error</option>
                    </select>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeNotificationModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Send Notification</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script src="/frontend/js/notifications.js"></script>
</body>
</html>
