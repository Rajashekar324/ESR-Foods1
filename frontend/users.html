<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - ESR Foods</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <span class="sidebar-logo-icon">🦐</span>
                    <span>ESR Foods</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="products.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🐟</span>
                    <span>Products</span>
                </a>
                <a href="inventory.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">📦</span>
                    <span>Inventory</span>
                </a>
                <a href="vendors.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🏭</span>
                    <span>Vendors</span>
                </a>
                <a href="purchases.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🛒</span>
                    <span>Purchases</span>
                </a>
                <a href="restaurants.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🍽️</span>
                    <span>Restaurants</span>
                </a>
                <a href="customers.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">👥</span>
                    <span>Customers</span>
                </a>
                <a href="orders.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">📋</span>
                    <span>Orders</span>
                </a>
                <a href="invoices.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🧾</span>
                    <span>Invoices</span>
                </a>
                <a href="payments.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">💰</span>
                    <span>Payments</span>
                </a>
                <a href="expenses.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">💸</span>
                    <span>Expenses</span>
                </a>
                <a href="reports.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">📈</span>
                    <span>Reports</span>
                </a>
                <a href="notifications.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">🔔</span>
                    <span>Notifications</span>
                </a>
                <a href="users.html" class="sidebar-nav-item active">
                    <span class="sidebar-nav-item-icon">👤</span>
                    <span>Users</span>
                </a>
                <a href="settings.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-item-icon">⚙️</span>
                    <span>Settings</span>
                </a>
                <a href="#" class="sidebar-nav-item" onclick="logout()">
                    <span class="sidebar-nav-item-icon">🚪</span>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1 class="header-title">Users</h1>
                <div class="header-actions">
                    <span id="userName" style="font-weight: 600; color: var(--text-secondary);"></span>
                    <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
                </div>
            </header>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <select id="roleFilter" class="form-select filter-select">
                    <option value="">All Roles</option>
                </select>
                <select id="statusFilter" class="form-select filter-select">
                    <option value="">All access statuses</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                    <option value="disabled">Disabled</option>
                </select>
                <button class="btn btn-primary" onclick="openUserModal()">Add User</button>
            </div>

            <!-- Users Table -->
            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Registration Date</th>
                                <th>Status</th>
                                <th>Last Login</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <tr>
                                <td colspan="7" class="loading">
                                    <div class="spinner"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- User Modal -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="userModalTitle">Add User</h3>
                <button class="modal-close" onclick="closeUserModal()">&times;</button>
            </div>
            <form id="userForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="userUsername" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="userEmail" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="userPassword" class="form-input" minlength="12" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="userFullName" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" id="userPhone" class="form-input">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select id="userRole" class="form-select" required>
                        <option value="">Select Role</option>
                    </select>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeUserModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script src="/frontend/js/users.js"></script>
</body>
</html>
